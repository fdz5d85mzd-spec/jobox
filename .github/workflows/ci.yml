name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/jobox
          NEON_AUTH_BASE_URL: https://example.invalid/auth
          NEON_AUTH_COOKIE_SECRET: ci-only-placeholder-secret
          NEXT_PUBLIC_APP_URL: https://example.invalid
